name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — install · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Jest sets NODE_ENV=test automatically, but set here explicitly so
          # validateEnv() is skipped and logger is silenced in CI as well.
          NODE_ENV: test

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — install · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # tsc -b runs as part of the Vite build script — type errors fail the job.
        run: npm run build
