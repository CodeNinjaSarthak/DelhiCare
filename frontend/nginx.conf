server {
    listen 80;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # React Router handles client-side paths. Any path that doesn't match a
    # real file falls back to index.html so the app can bootstrap and render
    # the correct route itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # Proxying /api/ to the backend container means:
    #   1. No CORS issues — browser sees a same-origin request.
    #   2. Frontend code can use relative URLs (/api/v1/...) without env vars.
    #   3. Backend port (4000) is not exposed to the internet; only nginx (80) is.
    location /api/ {
        proxy_pass         http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Forward correlation ID if set by the client.
        proxy_set_header   X-Request-ID      $http_x_request_id;
    }

    # ── Health endpoint proxy ─────────────────────────────────────────────────
    location /health {
        proxy_pass         http://backend:4000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Socket.IO proxy ───────────────────────────────────────────────────────
    # Socket.IO upgrades HTTP → WebSocket. The Upgrade and Connection headers
    # must be forwarded explicitly; nginx strips them by default.
    location /socket.io/ {
        proxy_pass         http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
